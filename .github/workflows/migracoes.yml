name: Migrações Supabase

# Aplica à base de dados os ficheiros novos em supabase/migrations/ (por ordem alfabética).
# Cada ficheiro é aplicado uma única vez, numa transação; o registo fica em private.migracoes.
# Requer o segredo do repositório SUPABASE_DB_URL (connection string do "Session pooler").

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', '.github/workflows/migracoes.yml']
  workflow_dispatch:

concurrency: migracoes

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar migrações
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then echo "::error::Falta o segredo SUPABASE_DB_URL no repositório"; exit 1; fi
          # limpar erros comuns ao copiar no telemóvel: espaços/quebras de linha e os [ ] de [YOUR-PASSWORD]
          DB_URL=$(printf '%s' "$DB_URL" | tr -d '[:space:]' | tr -d '[]')
          echo "::add-mask::$DB_URL"
          psql --version
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "create schema if not exists private; create table if not exists private.migracoes (nome text primary key, aplicada_em timestamptz not null default now());"
          for f in $(ls supabase/migrations/*.sql | sort); do
            n=$(basename "$f")
            if [ "$(psql "$DB_URL" -tAc "select 1 from private.migracoes where nome = '$n'")" = "1" ]; then
              echo "✓ já aplicada: $n"; continue
            fi
            echo "→ a aplicar: $n"
            psql "$DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$f" -c "insert into private.migracoes (nome) values ('$n')"
          done
          echo "Estado:"
          psql "$DB_URL" -c "select nome, aplicada_em from private.migracoes order by nome"
