name: Função de notificações (push)

# Publica a Edge Function "push" no Supabase e configura as chaves.
# Requer os segredos do repositório SUPABASE_ACCESS_TOKEN (token pessoal da conta Supabase do projeto)
# e SUPABASE_DB_URL (já usado nas migrações). As chaves VAPID são geradas aqui, uma única vez:
# a privada fica só nos segredos do Supabase; a pública é gravada em public.config_publica.

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/funcoes.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Migrações Supabase']
    types: [completed]

concurrency: funcoes

jobs:
  publicar:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      PROJ: zkbnhyzxuymcowfepsdz
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verificar segredos
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then echo "::error::Falta o segredo SUPABASE_ACCESS_TOKEN no repositório"; exit 1; fi
          if [ -z "${DB_URL:-}" ]; then echo "::error::Falta o segredo SUPABASE_DB_URL no repositório"; exit 1; fi
      - name: Configurar chaves
        run: |
          set -euo pipefail
          DB_URL=$(printf '%s' "$DB_URL" | tr -d '[:space:]' | tr -d '[]')
          DB_URL=$(DB_URL="$DB_URL" python3 -c '
          import os, urllib.parse as u
          url = os.environ["DB_URL"]
          esq, sep, resto = url.partition("://")
          cred, _, host = resto.rpartition("@")
          user, _, pw = cred.partition(":")
          pw = u.quote(u.unquote(pw), safe="")
          print(f"{esq}{sep}{user}:{pw}@{host}")')
          echo "::add-mask::$DB_URL"
          SEG=$(psql "$DB_URL" -tAc "select valor from private.config where chave = 'push_segredo'")
          if [ -z "$SEG" ]; then echo "::error::Falta private.config.push_segredo (a migração 06 já correu?)"; exit 1; fi
          echo "::add-mask::$SEG"
          PUB=$(psql "$DB_URL" -tAc "select valor from public.config_publica where chave = 'vapid_public'")
          if [ -z "$PUB" ] || ! supabase secrets list --project-ref "$PROJ" | grep -q VAPID_PRIVATE; then
            echo "A gerar chaves VAPID novas"
            KEYS=$(npx --yes web-push@3.6.7 generate-vapid-keys --json)
            PUB=$(printf '%s' "$KEYS" | python3 -c 'import sys,json; print(json.load(sys.stdin)["publicKey"])')
            PRIV=$(printf '%s' "$KEYS" | python3 -c 'import sys,json; print(json.load(sys.stdin)["privateKey"])')
            echo "::add-mask::$PRIV"
            supabase secrets set --yes --project-ref "$PROJ" VAPID_PUBLIC="$PUB" VAPID_PRIVATE="$PRIV" PUSH_SEGREDO="$SEG" > /dev/null
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "insert into public.config_publica (chave, valor) values ('vapid_public', '$PUB') on conflict (chave) do update set valor = excluded.valor; delete from public.push_subscricoes;"
          else
            supabase secrets set --yes --project-ref "$PROJ" PUSH_SEGREDO="$SEG" > /dev/null
            echo "Chaves VAPID já existem"
          fi
      - name: Publicar função
        run: supabase functions deploy push --yes --project-ref "$PROJ" --no-verify-jwt --use-api
